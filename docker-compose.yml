services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iam}
      POSTGRES_USER: ${POSTGRES_USER:-iam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iam}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - iam_postgres_data:/var/lib/postgresql/data
    networks:
      - iam_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iam} -d ${POSTGRES_DB:-iam}"]
      interval: 5s
      timeout: 3s
      retries: 20

  liquibase:
    image: liquibase/liquibase:4.31.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database:/liquibase/iam-db:ro
    command:
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-iam}
      - --username=${POSTGRES_USER:-iam}
      - --password=${POSTGRES_PASSWORD:-iam}
      - --changelog-file=iam-db/changelog/changelog-master.yaml
      - update
    restart: "no"
    networks:
      - iam_network

  backend:
    build: ./backend
    depends_on:
      liquibase:
        condition: service_completed_successfully
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-iam}:${POSTGRES_PASSWORD:-iam}@postgres:5432/${POSTGRES_DB:-iam}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-before-production-123456}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@sena.edu.co}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin123*}
      BOOTSTRAP_ADMIN_FIRST_NAME: ${BOOTSTRAP_ADMIN_FIRST_NAME:-System}
      BOOTSTRAP_ADMIN_LAST_NAME: ${BOOTSTRAP_ADMIN_LAST_NAME:-Admin}
    expose:
      - "8080"
    networks:
      - iam_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:80"
    networks:
      - iam_network

volumes:
  iam_postgres_data:

networks:
  iam_network:
    driver: bridge
